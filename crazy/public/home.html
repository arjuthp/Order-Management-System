<!DOCTYPE html>
<html>
<head>
    <title>Home - Products</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        
        .navbar {
            background: #007bff;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 { font-size: 24px; }
        .navbar button {
            background: white;
            color: #007bff;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        
        h2 { margin-bottom: 20px; }
        
        .product-list {
            background: white;
            border-radius: 8px;
            padding: 20px;
        }
        
        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }
        .product-item:last-child { border-bottom: none; }
        
        .product-info h3 { margin-bottom: 5px; }
        .product-info p { color: #666; font-size: 14px; }
        .product-price { font-size: 20px; font-weight: bold; color: #007bff; }
        .product-stock { color: #28a745; margin-left: 20px; }
        
        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background: #218838; }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>Order Management System</h1>
        <div>
            <span id="userName">Welcome, User</span>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <h2>Available Products</h2>
        <div class="product-list" id="productList">
            <div class="empty-state">Loading products...</div>
        </div>
    </div>

    <script>
        // Check if user is logged in
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
            window.location.href = '/';
        } else {
            document.getElementById('userName').innerText = `Welcome, ${user.name}`;
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = '/';
        }

        async function loadProducts() {
            try {
                const res = await fetch('/products');
                const products = await res.json();
                
                if (products.length === 0) {
                    document.getElementById('productList').innerHTML = 
                        '<div class="empty-state">No products available</div>';
                    return;
                }
                
                const html = products.map(product => `
                    <div class="product-item">
                        <div class="product-info">
                            <h3>${product.name}</h3>
                            <p>${product.description}</p>
                            <p>Category: ${product.category}</p>
                        </div>
                        <div style="display: flex; align-items: center; gap: 20px;">
                            <span class="product-price">₹${product.price}</span>
                            <span class="product-stock">Stock: ${product.stock}</span>
                            <button onclick="viewProduct('${product._id}')">View Details</button>
                        </div>
                    </div>
                `).join('');
                
                document.getElementById('productList').innerHTML = html;
            } catch (error) {
                document.getElementById('productList').innerHTML = 
                    '<div class="empty-state">Error loading products</div>';
            }
        }

        function viewProduct(productId) {
            alert('Product ID: ' + productId + '\nCart and order features coming soon!');
        }

        // Load products on page load
        loadProducts();
    </script>
</body>
</html>
